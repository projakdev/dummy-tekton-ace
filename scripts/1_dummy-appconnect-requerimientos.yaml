###*******************************************************************************************************************###
###*** DETAIL: This script installs all the RESOURCES, PERMISSIONS, ENABLEMENTS that are BASE for working with *******###
###*** OPENSHIFT-PIPELINE (TEKTON) automation. This MUST be executed before anything else. *****************************###
###*******************************************************************************************************************###

# THE PVC WILL NOT BE DELETED UNLESS ALL REFERENCES, INCLUDING THE 'INTEGRATION-SERVERs', ARE DELETED:
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: source-pvc-pipe
  
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi

---

# WORKAROUND: INSTALL BEFORE ANY EXECUTION TO HAVE THE 'IMAGE-STREAM' OF THE 'ACE12' IMAGE IN OPENSHIFT:
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ace-server
  
spec:
  lookupPolicy:
    local: false
  tags:
  - name: latest
    from:
      kind: DockerImage
      # 'APP CONNECT IMAGE REPOSITORY': https://www.ibm.com/docs/en/app-connect/containers_cd?topic=obtaining-app-connect-enterprise-server-image-from-cloud-container-registry
      # [ENTERPRISE SERVER IMAGE]: 
      # name: cp.icr.io/cp/appc/ace-server-prod@sha256:246828d9f89c4ed3a6719cd3e4b71b1dec382f848c9bf9c28156f78fa05bc4e7
      # [DEVELOPERS SERVER IMAGE]:
      name: icr.io/appc-dev/ace-server@sha256:a41f7501fe4025d2705bcabf1ad2ff523bcaf9ec263b98054501de1fc0cf5f62

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pipeline-deployer-aceflows-role
  
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "get"]
    
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["list", "get", "create", "update", "delete"]
    
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["list", "get", "create", "update", "delete"]
    
  - apiGroups: [""]
    resources: ["pods","secrets"]
    verbs: ["list", "get", "create", "update", "delete"]
 
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "get", "create", "update", "delete"]

  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreams","imagestreams/import"]
    verbs: ["list", "get", "patch", "create", "update", "delete"]
 
  - apiGroups: ["image.openshift.io"]
    resources: ["imagestreamtags"]
    verbs: ["list", "get", "create", "update", "delete"]
    
  - apiGroups: ["appconnect.ibm.com"]
    resources: ["configurations","integrationservers","integrationruntimes"]
    verbs: ["list", "get", "patch", "create", "update", "delete"]

  - apiGroups: ["build.openshift.io"]
    resources: ["builds", "buildconfigs", "buildconfigs/instantiatebinary"]
    verbs: ["list", "get", "watch", "patch", "create", "update", "delete"] 

  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints", "securitycontextconstraints/fake"]
    verbs: ["get", "list", "watch", "create", "update", "delete", "use"]

--- 

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pipeline-deployer-aceflows-rolebinding
  namespace:cp4i-install
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name:  pipeline-deployer-aceflows-role
subjects:
  - kind: ServiceAccount
    name: pipeline
    

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  finalizers:
  - kubernetes.io/iam.security.ibm.com
  name: edit
  
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: pipeline
  

---

# CONFIGURATION OF THE ACCESS 'PASSWORD' FOR THE GITHUB 'WEBHOOKS':
apiVersion: v1
kind: Secret
metadata:
  name: github-interceptor-secret
type: Opaque
stringData:
  secretToken: "12345678"